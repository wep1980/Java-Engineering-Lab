spring:
  application:
    name: java-engineering-lab-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:java_engineering_lab}
    username: ${POSTGRES_USER:jel}
    password: ${POSTGRES_PASSWORD:troque-esta-senha-localmente}
    hikari:
      # O laboratório de Race Condition dispara 10 transações concorrentes
      # que seguram a conexão durante uma espera artificial (ver
      # SPEC-LAB-RACE-001) — o pool precisa comportar isso com folga.
      maximum-pool-size: 20
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        generate_statistics: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      # Novo grupo consumidor sempre começa do início do tópico — nunca
      # perde um evento publicado antes da primeira subscrição.
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.javaengineeringlab.backend.laboratorios.kafka,com.javaengineeringlab.backend.laboratorios.ordenacao
        spring.json.value.default.type: com.javaengineeringlab.backend.laboratorios.kafka.EventoPagamentoConfirmado

server:
  port: ${PORTA_BACKEND:8080}

ollama:
  url: ${OLLAMA_URL:http://localhost:11434}
  modelo: ${OLLAMA_MODELO:llama3.2:3b}

logging:
  structured:
    format:
      console: ecs

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized
  tracing:
    sampling:
      probability: 1.0
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
