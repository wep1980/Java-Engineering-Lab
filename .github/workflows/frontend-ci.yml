name: Frontend CI

on:
  push:
    branches: [main, master]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"

jobs:
  build-e-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # Informativo — não falha o build (mesma política do Dependency-
      # Check do backend, ver ADR-0008). continue-on-error porque o
      # comando sai com código != 0 quando encontra qualquer achado.
      - name: Auditoria de dependências (npm audit)
        continue-on-error: true
        run: npm audit --audit-level=high
