name: java-engineering-lab

services:
  # ---------- profile: core ----------
  postgres:
    image: postgres:16-alpine
    profiles: ["core", "full"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-java_engineering_lab}
      POSTGRES_USER: ${POSTGRES_USER:-jel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    ports:
      - "${PORTA_POSTGRES:-5432}:5432"
    volumes:
      - postgres-dados:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jel}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    profiles: ["core", "full"]
    environment:
      PORTA_BACKEND: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-java_engineering_lab}
      POSTGRES_USER: ${POSTGRES_USER:-jel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    ports:
      - "${PORTA_BACKEND:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    profiles: ["core", "full"]
    environment:
      BACKEND_API_URL: http://backend:8080
    ports:
      - "${PORTA_FRONTEND:-3000}:3000"
    depends_on:
      - backend

  # ---------- profile: messaging ----------
  kafka:
    image: apache/kafka:3.8.0
    profiles: ["messaging", "full"]
    ports:
      - "${PORTA_KAFKA:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:19093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:19093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    profiles: ["messaging", "full"]
    ports:
      - "${PORTA_KAFKA_UI:-8081}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: java-engineering-lab
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
    depends_on:
      - kafka

  # ---------- profile: observability ----------
  prometheus:
    image: prom/prometheus:latest
    profiles: ["observability", "full"]
    ports:
      - "${PORTA_PROMETHEUS:-9090}:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:latest
    profiles: ["observability", "full"]
    ports:
      - "${PORTA_GRAFANA:-3300}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USUARIO_ADMIN:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_SENHA_ADMIN:?defina GRAFANA_SENHA_ADMIN no .env}
    volumes:
      - grafana-dados:/var/lib/grafana

  # ---------- profile: quality ----------
  sonarqube:
    image: sonarqube:community
    profiles: ["quality", "full"]
    ports:
      - "${PORTA_SONARQUBE:-9000}:9000"
    volumes:
      - sonarqube-dados:/opt/sonarqube/data
      - sonarqube-extensoes:/opt/sonarqube/extensions

volumes:
  postgres-dados:
  grafana-dados:
  sonarqube-dados:
  sonarqube-extensoes:
