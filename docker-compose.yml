name: java-engineering-lab

services:
  # ---------- profile: core ----------
  postgres:
    image: postgres:16-alpine
    profiles: ["core", "full"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-java_engineering_lab}
      POSTGRES_USER: ${POSTGRES_USER:-jel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    ports:
      - "${PORTA_POSTGRES:-5432}:5432"
    volumes:
      - postgres-dados:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jel}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    profiles: ["core", "full"]
    environment:
      PORTA_BACKEND: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-java_engineering_lab}
      POSTGRES_USER: ${POSTGRES_USER:-jel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      # "kafka" só resolve via DNS do Docker se o profile "messaging"
      # também estiver no ar — sem isso, o Kafka client falha de forma
      # SÍNCRONA (não é uma falha de conexão tolerada em background) se
      # NENHUM endereço resolver, derrubando o container inteiro. O
      # "localhost:9092" extra sempre resolve (loopback), garantindo que
      # ao menos um endereço resolva; a tentativa de conexão em si falha
      # graciosamente em background como esperado. Ver
      # docs/decisions/0007-fallback-de-bootstrap-servers-do-kafka.md.
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092,localhost:9092
      # Idem para o profile "observability" — sem Tempo no ar, a
      # exportação de traces só falha silenciosamente em background.
      OTLP_TRACING_ENDPOINT: http://tempo:4318/v1/traces
      # Idem para o profile "ai" — sem Ollama no ar, o assistente responde
      # 503 (ver LaboratorioIndisponivelException), o resto do backend
      # continua funcionando normalmente.
      OLLAMA_URL: http://ollama:11434
      # Idem para o profile "cache" — o cliente Redis (Lettuce) conecta
      # de forma preguiçosa/assíncrona, então sem Redis no ar o backend
      # sobe normalmente; só o laboratório de Cache Stampede fica
      # indisponível (503) até o profile subir.
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "${PORTA_BACKEND:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    profiles: ["core", "full"]
    environment:
      BACKEND_API_URL: http://backend:8080
    ports:
      - "${PORTA_FRONTEND:-3000}:3000"
    depends_on:
      - backend

  # ---------- profile: messaging ----------
  kafka:
    image: apache/kafka:3.8.0
    profiles: ["messaging", "full"]
    ports:
      - "${PORTA_KAFKA:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:19093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:19093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    profiles: ["messaging", "full"]
    ports:
      - "${PORTA_KAFKA_UI:-8081}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: java-engineering-lab
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
    depends_on:
      - kafka

  # ---------- profile: observability ----------
  prometheus:
    image: prom/prometheus:latest
    profiles: ["observability", "full"]
    ports:
      - "${PORTA_PROMETHEUS:-9090}:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:latest
    profiles: ["observability", "full"]
    ports:
      - "${PORTA_GRAFANA:-3300}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USUARIO_ADMIN:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_SENHA_ADMIN:?defina GRAFANA_SENHA_ADMIN no .env}
    volumes:
      - grafana-dados:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
      - tempo

  tempo:
    image: grafana/tempo:latest
    profiles: ["observability", "full"]
    command: ["-config.file=/etc/tempo.yaml"]
    ports:
      - "${PORTA_TEMPO:-3200}:3200"
    volumes:
      - ./infra/tempo/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-dados:/var/tempo

  # ---------- profile: ai ----------
  ollama:
    image: ollama/ollama:latest
    profiles: ["ai", "full"]
    ports:
      - "${PORTA_OLLAMA:-11434}:11434"
    volumes:
      - ollama-dados:/root/.ollama

  # Baixa o modelo na primeira subida e depois encerra — não é um
  # serviço de longa duração. Ver docs/links.md para acompanhar o
  # progresso do download.
  ollama-modelo:
    image: curlimages/curl:latest
    profiles: ["ai", "full"]
    depends_on:
      - ollama
    entrypoint:
      - sh
      - -c
      - |
        echo "Aguardando o Ollama ficar pronto...";
        until curl -sf http://ollama:11434/api/tags > /dev/null; do sleep 2; done;
        echo "Baixando o modelo ${OLLAMA_MODELO:-llama3.2:3b}...";
        curl -sf http://ollama:11434/api/pull -d "{\"model\":\"${OLLAMA_MODELO:-llama3.2:3b}\"}";
        echo "Modelo pronto.";

  # ---------- profile: cache ----------
  redis:
    image: redis:7-alpine
    profiles: ["cache", "full"]
    ports:
      - "${PORTA_REDIS:-6379}:6379"

  # ---------- profile: quality ----------
  sonarqube:
    image: sonarqube:community
    profiles: ["quality", "full"]
    ports:
      - "${PORTA_SONARQUBE:-9000}:9000"
    volumes:
      - sonarqube-dados:/opt/sonarqube/data
      - sonarqube-extensoes:/opt/sonarqube/extensions

volumes:
  postgres-dados:
  grafana-dados:
  tempo-dados:
  ollama-dados:
  sonarqube-dados:
  sonarqube-extensoes:
